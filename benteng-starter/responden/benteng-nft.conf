# Tabel nftables milik BENTENG, terpisah dari firewall bawaan OpenWrt (fw4).
# Perangkat yang IP-nya masuk set "karantina_v4" diputus: tidak bisa diteruskan
# ke internet maupun ke jaringan lain. Prioritas -1 membuat aturan ini diproses
# sebelum aturan fw4 (prioritas 0).
table inet benteng {
	set karantina_v4 {
		type ipv4_addr
	}

	chain forward {
		type filter hook forward priority -1; policy accept;
		ip saddr @karantina_v4 drop
		ip daddr @karantina_v4 drop
	}

	# Akses web (HTTP port 80) dari perangkat karantina dialihkan ke halaman
	# pemberitahuan di sensor (uhttpd port 8081), sehingga pengguna tahu
	# perangkatnya diputus dan harus menghubungi petugas. Prioritas -101
	# berjalan sebelum NAT fw4 (dstnat, -100). DNS ke sensor tetap jalan,
	# jadi query perangkat karantina masih tercatat untuk analis.
	chain prerouting {
		type nat hook prerouting priority -101; policy accept;
		ip saddr @karantina_v4 tcp dport 80 redirect to :8081
	}
}
